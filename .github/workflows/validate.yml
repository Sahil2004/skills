name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 scripts/validate.py
      - run: python3 scripts/install.py --list
      - run: python3 scripts/check_cli_parity.py
      - run: node bin/cli.js --all --dry-run
      - run: npm pack --dry-run
      - run: python3 scripts/test_package.py
